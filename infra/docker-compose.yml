name: refinery-iq

# Local stack. Supabase is managed (cloud, free). No Ollama / local LLM (ADR-0004):
# chat = Groq + Gemini APIs, embeddings + OCR = Gemini. The `worker` service is
# added once the ingestion pipeline is implemented.

services:
  web:
    build: { context: .., dockerfile: infra/Dockerfile, target: runner }
    command: node server.js
    env_file: ../.env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # demo only — enable for prod
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes: [ es_data:/usr/share/elasticsearch/data ]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [ redis_data:/data ]
    ports: ["6379:6379"]
    restart: unless-stopped

volumes: { es_data: {}, redis_data: {} }
